<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#19352b">Mạch thật đề xuất — lọc RC ngõ vào ADC và diode flyback ngõ ra (2A)</text>

  <rect x="20" y="44" width="450" height="300" rx="10" fill="#f4faf6" stroke="#176b4a"/>
  <text x="40" y="70" font-size="13" font-weight="700" fill="#176b4a">Ngõ vào: lọc thông thấp RC trước ADC</text>

  <rect x="40" y="100" width="130" height="64" rx="8" fill="#ffffff" stroke="#176b4a"/>
  <text x="105" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#19352b">Cảm biến độ ẩm</text>
  <text x="105" y="142" text-anchor="middle" font-size="11" fill="#4a6357">điện dung · OUT 0–3.3V</text>
  <text x="105" y="180" text-anchor="middle" font-size="11" fill="#4a6357">VCC → 3V3 · GND chung</text>

  <line x1="170" y1="132" x2="220" y2="132" stroke="#19352b" stroke-width="2"/>
  <rect x="220" y="124" width="60" height="16" fill="#ffffff" stroke="#19352b" stroke-width="2"/>
  <text x="250" y="116" text-anchor="middle" font-size="11" fill="#19352b">R = 1 kΩ</text>
  <line x1="280" y1="132" x2="380" y2="132" stroke="#19352b" stroke-width="2"/>
  <circle cx="330" cy="132" r="3" fill="#19352b"/>
  <line x1="330" y1="132" x2="330" y2="168" stroke="#19352b" stroke-width="2"/>
  <line x1="316" y1="168" x2="344" y2="168" stroke="#19352b" stroke-width="2"/>
  <line x1="316" y1="176" x2="344" y2="176" stroke="#19352b" stroke-width="2"/>
  <line x1="330" y1="176" x2="330" y2="200" stroke="#19352b" stroke-width="2"/>
  <line x1="318" y1="200" x2="342" y2="200" stroke="#19352b" stroke-width="2"/>
  <line x1="323" y1="206" x2="337" y2="206" stroke="#19352b" stroke-width="2"/>
  <line x1="327" y1="212" x2="333" y2="212" stroke="#19352b" stroke-width="2"/>
  <text x="352" y="176" font-size="11" fill="#19352b">C = 100 nF</text>

  <rect x="380" y="100" width="72" height="64" rx="8" fill="#ffffff" stroke="#176b4a"/>
  <text x="416" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#19352b">ESP32</text>
  <text x="416" y="142" text-anchor="middle" font-size="11" fill="#4a6357">GPIO34 ADC</text>

  <text x="40" y="250" font-size="11" fill="#19352b">fc = 1/(2πRC) ≈ 1.6 kHz — cắt nhiễu xung trước khi vào ADC.</text>
  <text x="40" y="270" font-size="11" fill="#19352b">Firmware lọc số thêm: trimmed mean 10 mẫu (bỏ 2 cao + 2 thấp)</text>
  <text x="40" y="288" font-size="11" fill="#19352b">rồi EMA α = 0.3 → giá trị % ổn định, ít giật cục.</text>
  <text x="40" y="316" font-size="11" fill="#a62b25">Cảm biến thật có thể ngược chiều ADC: đo khô/ướt rồi sửa</text>
  <text x="40" y="332" font-size="11" fill="#a62b25">SOIL_RAW_DRY / SOIL_RAW_WET trong Config.h.</text>

  <rect x="490" y="44" width="450" height="300" rx="10" fill="#f7f4fc" stroke="#6b46c1"/>
  <text x="510" y="70" font-size="13" font-weight="700" fill="#6b46c1">Ngõ ra: relay cách ly + diode flyback cho tải 12V</text>

  <rect x="510" y="100" width="80" height="64" rx="8" fill="#ffffff" stroke="#6b46c1"/>
  <text x="550" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#19352b">ESP32</text>
  <text x="550" y="142" text-anchor="middle" font-size="11" fill="#4a6357">GPIO26/25</text>
  <line x1="590" y1="132" x2="630" y2="132" stroke="#19352b" stroke-width="2"/>
  <rect x="630" y="100" width="100" height="64" rx="8" fill="#ffffff" stroke="#6b46c1"/>
  <text x="680" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#19352b">Relay 5V</text>
  <text x="680" y="142" text-anchor="middle" font-size="11" fill="#4a6357">opto cách ly</text>
  <line x1="730" y1="132" x2="780" y2="132" stroke="#19352b" stroke-width="2"/>
  <text x="755" y="122" text-anchor="middle" font-size="10" fill="#4a6357">tiếp điểm</text>
  <rect x="780" y="100" width="130" height="64" rx="8" fill="#ffffff" stroke="#6b46c1"/>
  <text x="845" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#19352b">Cuộn van / bơm</text>
  <text x="845" y="142" text-anchor="middle" font-size="11" fill="#4a6357">12V DC · nguồn riêng</text>

  <line x1="795" y1="164" x2="795" y2="192" stroke="#19352b" stroke-width="2"/>
  <line x1="795" y1="232" x2="795" y2="244" stroke="#19352b" stroke-width="2"/>
  <path d="M783,232 L807,232 L795,208 z" fill="#ffffff" stroke="#19352b" stroke-width="2"/>
  <line x1="783" y1="204" x2="807" y2="204" stroke="#19352b" stroke-width="2"/>
  <line x1="795" y1="192" x2="795" y2="204" stroke="#19352b" stroke-width="2"/>
  <line x1="795" y1="244" x2="895" y2="244" stroke="#19352b" stroke-width="2"/>
  <line x1="895" y1="244" x2="895" y2="164" stroke="#19352b" stroke-width="2"/>
  <text x="815" y="222" font-size="11" fill="#19352b">1N4007</text>
  <text x="815" y="238" font-size="10" fill="#4a6357">cathode về +12V</text>

  <text x="510" y="272" font-size="11" fill="#19352b">Nguồn 12V riêng cho bơm/van; chung GND với ESP32.</text>
  <text x="510" y="292" font-size="11" fill="#19352b">Diode triệt xung cảm ứng khi ngắt cuộn dây, bảo vệ tiếp điểm.</text>
  <text x="510" y="316" font-size="11" fill="#a62b25">Kiểm tra dòng relay ≥ dòng tải, thêm cầu chì và cách ly điện</text>
  <text x="510" y="332" font-size="11" fill="#a62b25">trước khi chạy thật. Wokwi chỉ mô phỏng relay/LED.</text>

  <text x="480" y="400" text-anchor="middle" font-size="11" fill="#698075">Hình dùng cho báo cáo; giá trị R/C và diode là đề xuất điển hình, cần kiểm chứng khi lắp mạch thật.</text>
</svg>